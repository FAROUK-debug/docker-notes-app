services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db  # the service name below: Docker's network resolves it
      POSTGRES_DB: ${POSTGRES_DB:?copy .env.example to .env}
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
    depends_on:
      db:
        condition: service_healthy  # wait until PostgreSQL accepts connections
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?copy .env.example to .env}
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
    volumes:
      - notes_data:/var/lib/postgresql/data  # notes survive docker compose down
    healthcheck:
      # -h localhost: during first setup PostgreSQL listens only on its socket, so this waits for the real server.
      test: ["CMD-SHELL", "pg_isready -h localhost -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  notes_data:
